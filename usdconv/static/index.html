<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USD Converter</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}
</script>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>USD Converter</div>
  <nav id="nav">
    <a href="#/new" data-v="new" data-i18n="nav_new"></a>
    <a href="#/sources" data-v="sources" data-i18n="nav_sources"></a>
    <a href="#/jobs" data-v="jobs" data-i18n="nav_jobs"></a>
  </nav>
  <span class="sp"></span>
  <span id="who" hidden><span id="email" class="muted"></span>
    <a id="adminlink" href="/admin.html" hidden class="btn ghost sm">Admin</a>
    <button id="logout" class="ghost sm" data-i18n="logout"></button></span>
  <button id="lang" class="ghost sm">EN</button>
</header>

<!-- login -->
<div id="auth" class="overlay" hidden>
  <form id="authform" class="card pad">
    <h2>USD Converter</h2><p class="muted" data-i18n="tagline"></p>
    <label><span data-i18n="email"></span><input id="aemail" type="email" required autocomplete="username"></label>
    <label><span data-i18n="password"></span><input id="apass" type="password" required minlength="10" autocomplete="current-password"></label>
    <button class="primary" type="submit" data-i18n="login"></button>
    <button class="ghost" id="signup" type="button" data-i18n="signup" style="width:100%;margin-top:6px"></button>
    <div id="amsg" class="warn"></div>
  </form>
</div>

<!-- workspace -->
<div id="dragveil" hidden><div data-i18n="drop_release"></div></div>
<main id="v-new" class="view wiz">
  <ol id="stepper">
    <li data-s="1"><i>1</i><span data-i18n="st1"></span></li>
    <li data-s="2"><i>2</i><span data-i18n="st2"></span></li>
    <li data-s="3"><i>3</i><span data-i18n="st3"></span></li>
  </ol>

  <!-- step 1: add data -->
  <section id="s1" class="step">
    <div class="center">
      <h1 data-i18n="s1_title"></h1>
      <div id="drop" tabindex="0">
        <div class="ico">⬆</div>
        <b data-i18n="drop_title"></b>
        <span data-i18n="drop_sub"></span>
        <input id="fileinput" type="file" accept=".geojson,.json" multiple hidden>
      </div>
      <div class="or" data-i18n="or"></div>
      <div class="alts">
        <button id="addsrc" class="alt"><b data-i18n="alt_service"></b><small data-i18n="alt_service_sub"></small></button>
        <button id="demo" class="alt"><b data-i18n="alt_demo"></b><small data-i18n="alt_demo_sub"></small></button>
      </div>
      <div id="added"></div>
      <div id="msg1" class="warn"></div>
      <button id="next1" class="primary big" disabled data-i18n="next"></button>
    </div>
  </section>

  <!-- step 2: settings -->
  <section id="s2" class="step" hidden>
    <div class="center wide2">
      <h1 data-i18n="s2_title"></h1>
      <p class="muted" data-i18n="s2_sub"></p>
      <label class="pname"><span data-i18n="name"></span><input id="pname" value="My project"></label>
      <div id="layers"></div>
      <details class="adv" id="projadv">
        <summary data-i18n="advanced"></summary>
        <div class="g2">
          <label><span data-i18n="crs"></span><select id="crs"><option value="auto_utm" data-i18n="autoutm"></option><option value="EPSG:3857">EPSG:3857</option><option value="EPSG:5254">EPSG:5254</option><option value="EPSG:32635">EPSG:32635</option></select></label>
          <label><span data-i18n="tile"></span><input id="tile" type="number" value="1000" min="50"></label>
          <label><span data-i18n="base"></span><input id="base" type="number" value="0"></label>
          <label><span data-i18n="anchor"></span><div class="g2"><input id="ax" type="number" placeholder="X"><input id="ay" type="number" placeholder="Y"></div></label>
        </div>
      </details>
      <div id="msg" class="warn"></div>
      <div class="navrow"><button id="back2" class="ghost" data-i18n="back"></button><button id="go" class="primary" data-i18n="convert"></button></div>
    </div>
  </section>

  <!-- step 3: preview -->
  <section id="s3" class="step s3" hidden>
    <section id="view"><div id="wm" hidden>PREVIEW · usd-converter</div>
      <div id="hint"><div class="spin"></div><div id="hinttxt" data-i18n="working"></div></div></section>
    <aside class="side right" id="result" hidden>
      <div class="sec">
        <h3 data-i18n="result"></h3>
        <div id="stats"></div>
        <div id="price"></div>
        <button id="pay" class="primary big" data-i18n="pay"></button>
        <a id="dl" class="btn primary big" hidden data-i18n="download"></a>
        <p class="muted small" id="paynote"></p>
      </div>
      <div class="sec"><button id="tweak" class="ghost big" data-i18n="tweak"></button><button id="again" class="ghost big" data-i18n="again"></button></div>
    </aside>
  </section>
</main>

<!-- sources -->
<main id="v-sources" class="view page" hidden>
  <h2 data-i18n="nav_sources"></h2>
  <p class="muted" data-i18n="sources_help"></p>
  <div><button id="newsvc" class="primary" data-i18n="add_service"></button></div>
  <div id="conns" class="cards"></div>
</main>

<!-- jobs -->
<main id="v-jobs" class="view page" hidden>
  <h2 data-i18n="nav_jobs"></h2>
  <table id="jobtable"></table>
</main>

<!-- add service modal -->
<div id="m-svc" class="overlay" hidden>
  <form id="svcform" class="card pad wide">
    <h2 data-i18n="add_service"></h2>
    <div class="types" id="svctypes">
      <label class="type"><input type="radio" name="kind" value="arcgis" checked><b>ArcGIS Server</b><small>REST / FeatureServer</small></label>
      <label class="type"><input type="radio" name="kind" value="wfs"><b>GeoServer / WFS</b><small>OGC WFS</small></label>
      <label class="type"><input type="radio" name="kind" value="geojson_url"><b>GeoJSON URL</b><small data-i18n="t_geojson"></small></label>
    </div>
    <label><span data-i18n="svc_name"></span><input id="svcname" required maxlength="80"></label>
    <label><span>URL</span><input id="svcurl" required placeholder="https://…"></label>
    <p class="muted small" id="svchint"></p>
    <p class="note" data-i18n="no_store"></p>
    <div class="rowh"><button type="button" class="ghost" data-close data-i18n="cancel"></button><button class="primary" data-i18n="save"></button></div>
    <div id="svcmsg" class="warn"></div>
  </form>
</div>

<!-- service picker (from the Convert page) -->
<div id="m-pick" class="overlay" hidden>
  <div class="card pad wide">
    <div class="rowh"><h2 data-i18n="pick_title"></h2><button class="ghost sm" data-close>✕</button></div>
    <button id="pick-new" class="primary big" data-i18n="add_service"></button>
    <div id="picklist"></div>
  </div>
</div>

<!-- catalog modal -->
<div id="m-cat" class="overlay" hidden>
  <div class="card pad wide tall">
    <div class="rowh"><h2 id="cattitle"></h2><button class="ghost sm" data-close>✕</button></div>
    <details id="credbox"><summary data-i18n="login_needed"></summary>
      <div class="g3"><label><span data-i18n="user"></span><input id="cuser" autocomplete="off"></label>
        <label><span data-i18n="pass"></span><input id="cpass" type="password" autocomplete="new-password"></label>
        <label><span data-i18n="tokenl"></span><input id="ctoken" autocomplete="off"></label></div>
      <p class="note" data-i18n="no_store_session"></p>
      <button id="cconnect" class="primary sm" data-i18n="connect"></button>
    </details>
    <input id="catq" placeholder="🔍" data-i18n-ph="search">
    <div id="catstatus" class="muted"></div>
    <div id="catlist"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
